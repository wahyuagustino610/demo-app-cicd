server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/demo-app.access.log;
    error_log  /var/log/nginx/demo-app.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;

    location /dev/     { proxy_pass http://127.0.0.1:8081/; }
    location /staging/ { proxy_pass http://127.0.0.1:8082/; }
    location /beta/    { proxy_pass http://127.0.0.1:8083/; }
    location /live/    { proxy_pass http://127.0.0.1:8084/; }
    location /         { return 404; }
}
