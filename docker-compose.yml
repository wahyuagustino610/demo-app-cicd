services:
  app:
    image: demo-app:${IMAGE_TAG}
    build: .
    container_name: demo-${APP_ENV}
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
    ports:
      - "${HOST_PORT}:8000"
    read_only: true
    mem_limit: ${MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
